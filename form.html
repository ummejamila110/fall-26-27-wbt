<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        <table>
            <h2>Donar Information</h2>
            <tr>
                <td><label for="name">First Name*</label></td>
                <td><input type="text" id="name" name="name" required></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name*</label></td>
                <td><input type="text" id="lname" name="lname" required></td>
            </tr>
            <tr>
                <td><label for="comp">Company</label></td>
                <td><input type="text" id="comp" name="comp"></td>
            </tr>
            <tr>
                <td><label for="add1">Address 1*</label></td>
                <td><input type="text" id="add1" name="add1" required></td>
            </tr>
            <tr>
                <td><label for="add2">Address 2</label></td>
                <td><input type="text" id="add2" name="add2"></td>
            </tr>
            <tr>
                <td><label for="city">City*</label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="state">State*</label></td>
                <td>
                    <select id="state" name="state">
                        <option>Select a state</option>
                        <option>Barishal</option>
                        <option>Chattagram</option>
                        <option>Dhaka</option>
                        <option>Khulna</option>
                        <option>Rangpur</option>
                        <option>Sylhet</option>
                    </select>
                </td>
            </tr>

              <tr>
                <td><label for="zip">zip Code*</label></td>
                <td><input type="number" id="zip" name="zip" required></td>
            </tr>

             <tr>
                <td><label for="country">Country*</label></td>
                <td>
                    <select id="country" name="country">
                        <option>Select a country</option>
                        <option>Bangladesh</option>
                        <option>Ireland</option>
                        <option>UK</option>
                        <option>USA</option>
                        
                    </select>
                </td>
            </tr>

             <tr>
                <td><label for="phone">Phone</label></td>
                <td><input type="tel" id="phone" name="phone" ></td>
            </tr>

               <tr>
                <td><label for="fax">Fax</label></td>
                <td><input type="tel" id="fax" name="fax" ></td>
            </tr>

               <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email" name="email" ></td>
            </tr>

            <tr>
                <td><label>Donation Ammount*<p>(Check a button or type in your ammount) </p></label></td>
                <td>
                    <input type="radio" name="donation" value="none">None
                    <input type="radio" name="donation" value="$50">$50
                    <input type="radio" name="donation" value="$75">$75
                    <input type="radio" name="donation" value="$100">$100
                    <input type="radio" name="donation" value="$250">$250
                     <input type="radio" name="donation" value="$75">$75
                      <input type="radio" name="donation" value="other">Other
                </td>
            </tr>

                <tr>
                <td></td>
                <td><label for="other">Other Amount $</label>
                <input type="number" id="other" name="other"></td>
               
                
            </tr>
            
              <tr>
                <td><label>Recurring Donation<p>(Check if yes) </p></label></td>
                <td><input type="checkbox" value="i am interested in giving on a regular basis">I am interested in giving on a regular basis</td>
            </tr>

          
<tr>
    <td></td>
    <td>
        <label for="creditCard">Monthly Credit Card $</label>
        <input type="text" id="creditCard" name="creditCard"><label for="for"> For</label> <input type="number" id="for" name="for"> Months</td>
    </tr>



          




        


           
        </table>
    </form>
</body>
</html>
